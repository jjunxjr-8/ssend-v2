<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScottFree - Query Display Receiver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MQTT WebSocket Library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .pulse-glow { animation: glow 2s infinite alternate; }
        @keyframes glow {
            0% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
            100% { box-shadow: 0 0 35px rgba(16, 185, 129, 0.6); }
        }
    </style>
</head>
<body class="h-screen w-screen bg-slate-950 text-slate-100 flex flex-col p-4 md:p-8 overflow-hidden">

    <!-- HEADER / STATUS BAR -->
    <header class="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl mb-6">
        <div class="flex items-center gap-3">
            <div class="p-2.5 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-400">
                <i class="fa-solid fa-satellite-dish text-xl"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-lg text-slate-100 tracking-wide">SCOTTFREE RECEIVER</h1>
                <p class="text-xs font-mono text-slate-400">Live Communication Terminal</p>
            </div>
        </div>

        <!-- Connection Badge -->
        <div class="flex items-center gap-2.5 bg-slate-950 border border-slate-800 px-4 py-2 rounded-xl">
            <span id="statusDot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="statusText" class="font-mono text-xs font-bold text-slate-400 uppercase tracking-wider">Connecting...</span>
        </div>
    </header>

    <!-- MAIN DISPLAY REGION -->
    <main class="flex-1 flex flex-col gap-6 min-h-0">
        
        <!-- Live Incoming Text Card -->
        <div class="flex-1 bg-slate-900 border-2 border-slate-800 pulse-glow rounded-3xl p-6 md:p-10 flex flex-col justify-between shadow-2xl relative overflow-hidden">
            
            <div class="flex items-center justify-between text-slate-400 text-xs font-mono font-bold tracking-widest uppercase">
                <span><i class="fa-solid fa-bullhorn mr-2 text-emerald-400"></i>Active Query</span>
                <span id="receivedTime">Waiting for input...</span>
            </div>

            <!-- Big Received Query Text -->
            <div class="my-auto text-center px-4">
                <h2 id="queryText" class="text-4xl sm:text-6xl md:text-7xl font-black text-emerald-400 font-mono tracking-wide leading-tight break-words">
                    LISTENING...
                </h2>
            </div>

            <!-- Speech & Controls -->
            <div class="flex items-center justify-between pt-4 border-t border-slate-800">
                <button onclick="speakCurrentQuery()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm flex items-center gap-2 transition">
                    <i class="fa-solid fa-volume-high"></i> Replay Speech
                </button>
                <span class="text-xs font-mono text-slate-500">Auto-TTS Enabled</span>
            </div>
        </div>

        <!-- Query History Log -->
        <div class="h-48 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col">
            <h3 class="text-xs font-mono font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-slate-500"></i> Recent Messages
            </h3>
            <div id="historyList" class="flex-1 overflow-y-auto space-y-2 pr-2">
                <div class="text-sm font-mono text-slate-600 italic">No previous queries received.</div>
            </div>
        </div>
    </main>

    <script>
        const ROOM_TOPIC = "scottfree/live_queries/channel_1";
        let currentMessage = "";

        // Connect to MQTT Cloud WebSocket
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        client.on('connect', () => {
            document.getElementById('statusDot').className = "w-3 h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
            document.getElementById('statusText').innerText = "Connected & Ready";
            document.getElementById('statusText').className = "font-mono text-xs font-bold text-emerald-400 uppercase tracking-wider";
            
            // Subscribe to room
            client.subscribe(ROOM_TOPIC);
        });

        client.on('offline', () => {
            document.getElementById('statusDot').className = "w-3 h-3 rounded-full bg-red-500";
            document.getElementById('statusText').innerText = "Disconnected";
            document.getElementById('statusText').className = "font-mono text-xs font-bold text-red-400 uppercase tracking-wider";
        });

        // Receive Message from Device A
        client.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                currentMessage = data.text;
                
                // Update Main Display
                const queryTextEl = document.getElementById('queryText');
                queryTextEl.innerText = currentMessage;
                
                const timeStr = new Date(data.timestamp).toLocaleTimeString();
                document.getElementById('receivedTime').innerText = `RECEIVED AT ${timeStr}`;

                // Speak Aloud
                speakCurrentQuery();

                // Add to History Log
                addToHistory(currentMessage, timeStr);

            } catch (e) {
                console.error("Invalid message format", e);
            }
        });

        function speakCurrentQuery() {
            if (!('speechSynthesis' in window) || !currentMessage) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentMessage.toLowerCase());
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function addToHistory(text, time) {
            const historyList = document.getElementById('historyList');
            
            // Clear placeholder
            if (historyList.children[0] && historyList.children[0].classList.contains('italic')) {
                historyList.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = "flex items-center justify-between bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-sm font-mono";
            item.innerHTML = `
                <span class="text-emerald-400 font-bold">${text}</span>
                <span class="text-xs text-slate-500">${time}</span>
            `;
            historyList.prepend(item);
        }
    </script>
</body>
</html>
